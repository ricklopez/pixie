[project]
name = "gateway-worker"
version = "0.1.0"
description = "Gateway execution worker: drives a reviewed automation through jev-ultrafast inside a controlled browser."
requires-python = ">=3.12"
dependencies = [
  # Pinned upstream engine (MIT). Gateway does not fork it; the controller calls its Browser and choose() directly.
  "jev-ultrafast @ git+https://github.com/browser-use/jev-ultrafast@1231850a0bf1a0c0341fe408ef1668dbbfdfac46",
]

[project.scripts]
gateway-worker = "gateway_worker.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["gateway_worker"]

[dependency-groups]
dev = ["pytest>=8.4,<9", "ruff>=0.14,<1"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
